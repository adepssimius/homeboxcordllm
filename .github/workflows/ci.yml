name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Typecheck, test and build; then, on a push, build the image with
# discordllm's build script and publish it as ghcr.io/<owner>/<this repo>.
# The recipe lives in discordLLM so every bot is built the same way.
jobs:
  bot:
    uses: adepssimius/discordLLM/.github/workflows/bot.yml@main
    permissions:
      contents: read
      packages: write
